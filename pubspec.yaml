name: frontend_cuidemjunts
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0

  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.0.0
  shared_preferences: ^2.2.3
  go_router: ^14.0.0
  equatable: ^2.0.5
  intl: ^0.20.2
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/images/Logo_CuidemJunts.png"
  windows:
    generate: true
    image_path: "assets/images/Logo_CuidemJunts.png"
  linux:
    generate: true
    image_path: "assets/images/Logo_CuidemJunts.png"
  web:
    generate: true
    image_path: "assets/images/Logo_CuidemJunts.png"
  image_path: "assets/images/Logo_CuidemJunts.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/Logo_CuidemJunts.png"
